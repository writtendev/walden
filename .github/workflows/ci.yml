name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false

      - name: Assert Go toolchain version and architecture
        run: |
          EXPECTED_GO="go1.25.3"
          ACTUAL_GO="$(go version | awk '{print $3}')"
          echo "Expected Go version: ${EXPECTED_GO}"
          echo "Actual Go version:   ${ACTUAL_GO}"
          if [ "${ACTUAL_GO}" != "${EXPECTED_GO}" ]; then
            echo "Error: Go version mismatch (expected ${EXPECTED_GO}, got ${ACTUAL_GO})"
            exit 1
          fi

          GOMOD_GO="$(grep -E '^go [0-9]+\.[0-9]+' go.mod | awk '{print $2}')"
          if [ "${ACTUAL_GO#go}" != "${GOMOD_GO}" ]; then
            echo "Error: go.mod version (${GOMOD_GO}) does not match toolchain (${ACTUAL_GO#go})"
            exit 1
          fi

          GOOS="$(go env GOOS)"
          GOARCH="$(go env GOARCH)"
          echo "Running on ${GOOS}/${GOARCH} (expected linux/${{ matrix.arch }})"
          if [ "${GOOS}" != "linux" ] || [ "${GOARCH}" != "${{ matrix.arch }}" ]; then
            echo "Error: runner architecture mismatch (expected linux/${{ matrix.arch }}, got ${GOOS}/${GOARCH})"
            exit 1
          fi

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "${UNFORMATTED}" ]; then
            echo "Error: The following files are not formatted with gofmt:"
            echo "${UNFORMATTED}"
            echo "Run 'gofmt -w .' to format."
            exit 1
          fi

      - name: Dependency guard (standard-library maximalism)
        run: |
          # walden enforces standard-library maximalism. Zero external dependencies.
          # Adding a dependency requires explicitly editing this allowlist in the same commit.
          ALLOWED_MODULES=("github.com/writtendev/walden")

          MODULES="$(go list -m -f '{{.Path}}' all)"
          echo "Discovered modules:"
          echo "${MODULES}"

          for MOD in ${MODULES}; do
            ALLOWED=false
            for OK in "${ALLOWED_MODULES[@]}"; do
              if [ "${MOD}" = "${OK}" ]; then
                ALLOWED=true
                break
              fi
            done
            if [ "${ALLOWED}" != "true" ]; then
              echo "Error: unauthorized external dependency found in go.mod: ${MOD}"
              echo "walden enforces zero external dependencies outside the standard library."
              echo "Adding a dependency requires editing the dependency guard allowlist in CI."
              exit 1
            fi
          done

          # Assert go.mod contains no require directive unless allowlist is expanded
          if grep -qE '^\s*require\b' go.mod; then
            if [ "${#ALLOWED_MODULES[@]}" -le 1 ]; then
              echo "Error: require directive found in go.mod with empty external dependency allowlist"
              exit 1
            fi
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test (-race)
        run: go test -race -v ./...

